worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # upload может быть больше дефолтного 1m
    client_max_body_size 20m;

    # Docker embedded DNS — резолв имён в runtime
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;
        server_name _;

        set $security http://security:3000;
        set $uploader http://uploader:3000;
        set $storage  http://storage:9000;

        # Внутренняя проверка токена через security.
        # auth_request: 2xx = ok, иначе клиенту 401/403.
        location = /_auth {
            internal;
            rewrite ^ /v1/token/validation break;
            proxy_pass $security;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
        }

        # POST /token → security POST /v1/token (анонимно)
        location = /token {
            rewrite ^ /v1/token break;
            proxy_pass $security;
            proxy_set_header Host $host;
            proxy_set_header Content-Type $content_type;
        }

        # POST /register → security POST /v1/user (анонимно)
        location = /register {
            rewrite ^ /v1/user break;
            proxy_pass $security;
            proxy_set_header Host $host;
            proxy_set_header Content-Type $content_type;
        }

        # GET /user → auth, затем security GET /v1/user
        location = /user {
            auth_request /_auth;
            rewrite ^ /v1/user break;
            proxy_pass $security;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        # POST /upload → auth, затем uploader POST /v1/upload
        location = /upload {
            auth_request /_auth;
            rewrite ^ /v1/upload break;
            proxy_pass $uploader;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_request_buffering on;
        }

        # GET /images/{file} → объект в бакете MinIO (Storage_Bucket=data)
        location /images/ {
            rewrite ^/images/(.*)$ /data/$1 break;
            proxy_pass $storage;
            proxy_set_header Host $host;
        }
    }
}
