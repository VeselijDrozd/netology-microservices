server.host: "0.0.0.0"
server.name: kibana
elasticsearch.hosts: ["http://elasticsearch:9200"]
telemetry.enabled: false

# Security/Fleet в ДЗ не используем — отключаем, чтобы UI не сыпал ошибками
xpack.security.enabled: false
xpack.encryptedSavedObjects.encryptionKey: "netology-microservices-kibana-key-32"
xpack.reporting.encryptionKey: "netology-microservices-reporting-key"
xpack.fleet.enabled: false
xpack.securitySolution.enabled: false
